name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'     # upgraded from 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check          # ✅ already had this
        run: npx tsc --noEmit

      - name: Build               # ✅ only builds if tests pass
        run: npm run build
